services:
  activemq:
    image: apache/activemq-classic:5.18.3
    container_name: logisticsconnect-activemq
    restart: unless-stopped
    
    ports:
      # OpenWire port used by the Java messaging clients.
      - "127.0.0.1:61616:61616"

      # Local-only administration console.
      - "127.0.0.1:8161:8161"

    volumes:
      # Preserve the broker's persistent message store across restarts.
      - activemq-data:/opt/activemq/data

volumes:
  activemq-data:
