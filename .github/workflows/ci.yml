name: LogisticsConnect CI

# Run the pipeline for pushes, pull requests, and manual runs.
on:
  push:
  pull_request:
  workflow_dispatch:

# CI only needs to read the repository.
permissions:
  contents: read

# Avoid running duplicate pipelines for the same branch or pull request.
concurrency:
  group: logisticsconnect-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logisticsconnect-ci:
    name: Build and test Iterations 1–4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Get the repository.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Step 2: Configure the Java version used by every Maven project.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            ingestion-service/pom.xml
            hub-service/pom.xml
            delay-stage-service/pom.xml
            transit-service/pom.xml
            alertbot/pom.xml
            acceptance-tests/pom.xml

      # Step 3: Install Python for the cross-platform test runner.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Step 4: Compile and package all five independent services.
      - name: Build service modules
        run: |
          mvn -B -f ingestion-service/pom.xml package -DskipTests
          mvn -B -f hub-service/pom.xml package -DskipTests
          mvn -B -f delay-stage-service/pom.xml package -DskipTests
          mvn -B -f transit-service/pom.xml package -DskipTests
          mvn -B -f alertbot/pom.xml package -DskipTests

      # Step 5: Run all module unit tests.
      - name: Run unit tests
        run: |
          mvn -B -f ingestion-service/pom.xml test
          mvn -B -f hub-service/pom.xml test
          mvn -B -f delay-stage-service/pom.xml test
          mvn -B -f transit-service/pom.xml test
          mvn -B -f alertbot/pom.xml test

      # Step 6: The runner starts ActiveMQ and all required services.
      - name: Run end-to-end acceptance tests
        run: |
          python scripts/run-iteration-3-4-tests.py --mode acceptance --skip-build

      # Step 7: Verify the live event flow and simulated alert.
      - name: Run end-to-end smoke test
        run: |
          python scripts/run-iteration-3-4-tests.py --mode smoke --skip-build

      # Preserve service logs when build or integration testing fails.
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: logisticsconnect-integration-logs
          path: target/iteration-3-4-logs/
          if-no-files-found: warn
          retention-days: 7
